<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Branded og:image template, 1200x630. Filled by scripts/build-og-images.js.
     Placeholders are SITE (file path of frontend-v2), TAG, TITLE and SIZE, written in double braces. -->
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-stretch: 62% 125%; src: url('file://{{SITE}}/assets/fonts/archivo-variable.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400 600; src: url('file://{{SITE}}/assets/fonts/instrument-sans-variable.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: linear-gradient(135deg, #0A2540 0%, #0E2E52 100%); color: #fff; font-family: 'Instrument Sans', system-ui, sans-serif; }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #2B50FF; }
  .logo { position: absolute; left: 80px; top: 64px; height: 64px; }
  .tag { position: absolute; right: 80px; top: 76px; font-size: 22px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #F5A623; }
  .title { position: absolute; left: 80px; right: 80px; top: 180px; bottom: 150px; display: flex; align-items: center; font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; letter-spacing: -.03em; line-height: 1.08; font-size: {{SIZE}}px; text-wrap: balance; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: rgba(255,255,255,.72); border-top: 1px solid rgba(255,255,255,.18); padding-top: 24px; }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
  <div class="accent"></div>
  <img class="logo" src="file://{{SITE}}/assets/logo/appeal-edge-logo-white.png" alt="">
  <div class="tag">{{TAG}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="foot"><span>The Reinstatement Force</span><b>appeal-edge.com</b></div>
</body>
</html>
