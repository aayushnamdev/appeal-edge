<svg xmlns="http://www.w3.org/2000/svg" width="640" height="312" viewBox="0 0 640 312">
  <defs>
    <radialGradient id="bg1" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="90%" cy="108%" r="58%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg3" cx="52%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="lockG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="arG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="312" fill="#0A0D14"/>
  <rect width="640" height="312" fill="url(#bg1)"/>
  <rect width="640" height="312" fill="url(#bg2)"/>
  <rect width="640" height="312" fill="url(#bg3)"/>

  <!-- Top shimmer -->
  <line x1="0" y1="2" x2="640" y2="2" stroke="url(#shimmer)" stroke-width="2"/>
  <!-- Bottom shimmer -->
  <line x1="0" y1="310" x2="640" y2="310" stroke="url(#shimmer)" stroke-width="1.5"/>

  <!-- Vertical centre texture -->
  <line x1="320" y1="30" x2="320" y2="282" stroke="rgba(99,102,241,0.05)" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- === LOGO MARK === -->
  <!-- Shield body -->
  <path d="M 52,148 L 68,136 L 104,136 L 120,148 L 120,196 L 86,218 L 52,196 Z"
        fill="none" stroke="url(#lockG)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Keyhole circle -->
  <circle cx="86" cy="167" r="9" fill="none" stroke="url(#lockG)" stroke-width="3.2"/>
  <!-- Keyhole stem -->
  <line x1="86" y1="176" x2="86" y2="191" stroke="url(#lockG)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Left shackle arm -->
  <path d="M 68,136 L 68,108 Q 68,92 80,92 Q 92,92 92,108"
        fill="none" stroke="url(#lockG)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm — arrow pointing up -->
  <line x1="104" y1="136" x2="104" y2="84"
        stroke="url(#arG)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 93,100 L 104,78 L 115,100"
        fill="none" stroke="url(#arG)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="136" y="168" font-family="Inter,-apple-system,sans-serif" font-size="34" font-weight="600" letter-spacing="-0.025em" fill="#E8EAED">Appeal</text>
  <text x="136" y="206" font-family="Inter,-apple-system,sans-serif" font-size="34" font-weight="600" letter-spacing="-0.025em" fill="url(#mG)">Edge</text>

  <!-- Vertical rule -->
  <line x1="298" y1="100" x2="298" y2="230" stroke="rgba(99,102,241,0.22)" stroke-width="1.5"/>

  <!-- === CENTRE: Tagline + pills === -->
  <text x="455" y="128" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="22" font-weight="600" letter-spacing="-0.015em" fill="#E8EAED">Suspended on Amazon?</text>
  <text x="455" y="158" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="18" font-weight="400" fill="#A5B4FC">We've seen this case before.</text>

  <!-- Divider under tagline -->
  <line x1="318" y1="174" x2="592" y2="174" stroke="rgba(99,102,241,0.18)" stroke-width="1"/>

  <!-- Three pills -->
  <rect x="318" y="185" width="128" height="26" rx="13" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.30)" stroke-width="1"/>
  <text x="382" y="202" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12" font-weight="500" fill="#818CF8" letter-spacing="0.02em">Appeal specialists</text>

  <rect x="456" y="185" width="102" height="26" rx="13" fill="rgba(45,212,191,0.10)" stroke="rgba(45,212,191,0.28)" stroke-width="1"/>
  <text x="507" y="202" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12" font-weight="500" fill="#2DD4BF" letter-spacing="0.02em">48-hr results</text>

  <!-- Contact block bottom -->
  <line x1="318" y1="224" x2="592" y2="224" stroke="rgba(99,102,241,0.12)" stroke-width="1"/>

  <text x="318" y="248" font-family="'JetBrains Mono',monospace" font-size="13" fill="#5EEAD4" letter-spacing="0.03em">social@appeal-edge.com</text>
  <text x="318" y="270" font-family="'JetBrains Mono',monospace" font-size="13" fill="#5EEAD4" letter-spacing="0.03em">www.appeal-edge.com</text>

  <text x="318" y="292" font-family="Inter,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#4B5268">GET REINSTATED IN 48 HOURS</text>
</svg>
